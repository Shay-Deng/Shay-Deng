  <radialGradient id="glow"><stop stop-color="#7957db" stop-opacity=".35"/><stop offset="1" stop-color="#7957db" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bac7ff" stroke-opacity=".055"/></pattern>
</defs>
