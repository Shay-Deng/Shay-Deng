<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Howie Deng — Java, AI engineering and open source</title>
<desc id="desc">A midnight blue and violet banner with an orbital diagram, NYU CS, and the phrase Build with intent. Go deep.</desc>
